# Shared pipeline settings: source files, datamart paths, backfill windows and label definition.

paths:
  data_dir: data/
  datamart_dir: datamart/
  schema_dir: config/schemas/

# raw source systems -> bronze tables
# each source has its own backfill window, matching the snapshot range available in the raw data
sources:
  lms_loan_daily:
    csv_path: data/lms_loan_daily.csv
    start_date: "2023-01-01"
    end_date: "2025-11-01"
  attributes:
    csv_path: data/features_attributes.csv
    start_date: "2023-01-01"
    end_date: "2025-01-01"
  financials:
    csv_path: data/features_financials.csv
    start_date: "2023-01-01"
    end_date: "2025-01-01"
  clickstream:
    csv_path: data/feature_clickstream.csv
    start_date: "2023-01-01"
    end_date: "2024-12-01"

# a loan is "bad" if it is >= dpd days past due at month-on-book mob
label:
  dpd: 30
  mob: 6

# the feature store is built for every month in which a loan application can occur
feature_store:
  start_date: "2023-01-01"
  end_date: "2025-01-01"

ml:
  # loans before this date go into train; from this date onwards go into test
  # gives ~18 months train / ~6 months test (temporal split, no random shuffle)
  train_cutoff: "2024-07-01"
  model_store_dir: "model_store/"
  random_state: 42
  # gold columns NOT used as model inputs (still built in the feature store); '*' = prefix.
  # Clickstream exists only for loans before Jul 2024 (the training window) and for none after, so
  # it lifts in-period CV (~0.81 -> ~0.90) but is blank for every loan scored out of time (OOT 0.810 without vs 0.804 with)
  exclude_features: ["fe_*", "has_clickstream"]
  optuna_trials: 25    # complete Optuna TPE trials per candidate (best found by ~#11 at 50)
  tuning_cv_folds: 3   # folds inside the Optuna objective (only needs to rank candidates)
  cv_folds: 5          # folds for the final CV report of the tuned model
  # threads per model fit (XGBoost / RandomForest). Benchmark, one 5-fold XGBoost trial in
  # Docker/WSL: 1 -> 35s, 4 -> 13s, 8 -> 12s, all 16 -> 433s (oversubscription). 4 is safe on small laptops
  n_jobs: 4
  max_trees: 1000      # XGBoost ceiling; early stopping chooses the actual tree count
  early_stopping_rounds: 30
  optuna_storage: "model_store/optuna.db"   # SQLite DB; studies resume across runs
  # monthly traffic light (utils/ml/drift.py, docs/governance_sop.png); never retrains by itself
  monitoring:
    psi_amber: 0.10
    psi_red: 0.25
    gini_amber: 0.57              # applied to the 3-month mean Gini
    gini_red: 0.50
    feature_psi_major: 0.25       # any model input above this -> AMBER
    # 3-month mean of (predicted bad rate at 0.5) minus (actual bad rate); asymmetric because
    # missing bad loans costs more than flagging a few good ones
    flag_gap_over_amber: 0.10     # over-flagging by more than 10 points -> AMBER
    flag_gap_under_amber: 0.05    # under-flagging by more than 5 points -> AMBER
    refresh_months: 6             # months after train_cutoff -> refresh_due
  # challenger-vs-champion gate (utils/ml/promotion.py); promotion itself needs a person
  promotion:
    min_gini_uplift: 0.02         # ~1 CV std of Gini, so a "win" is not just noise
    max_score_psi: 0.10           # challenger scores stable across the out-of-time window
    min_shap_top10_overlap: 5     # top drivers broadly agree with the champion's
